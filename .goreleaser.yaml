# Adapted from krisiasty/videocheck's GoReleaser configuration.
# https://goreleaser.com
version: 2

project_name: osmex

builds:
  - id: darwin
    main: ./cmd/osmex
    binary: osmex
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .Date }}
  - id: linux
    main: ./cmd/osmex
    binary: osmex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .Date }}

archives:
  - id: darwin
    ids:
      - darwin
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/credentials.md
  - id: linux
    ids:
      - linux
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/credentials.md
      - deploy/systemd/*

checksum:
  name_template: checksums.txt

kos:
  - id: osmex
    build: linux
    repositories:
      - ghcr.io/krisiasty/osmex
    bare: true
    # Pinned by digest; nothing updates it automatically. task base-image (run first by task release) fails when the
    # tag has moved and prints the new value. Keep this on one line: the task reads it with sed.
    base_image: gcr.io/distroless/static-debian13:nonroot@sha256:25ac8f0c3b2334a9eb05452266bd4697864a8c8ef0ef71e5e6480d7f92868329
    user: "65532:65532"
    # The commit time, so the same commit always produces the same image digest.
    creation_time: "{{ .CommitTimestamp }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: spdx
    # Ko normally loads snapshots into Docker; keep local archive builds daemonless.
    disable: "{{ .IsSnapshot }}"
    tags:
      - "v{{ .Version }}"
      # Prereleases and snapshots must not replace stable release aliases.
      - '{{ if and (not .IsSnapshot) (not .Prerelease) }}v{{ .Major }}.{{ .Minor }}{{ end }}'
      - '{{ if and (not .IsSnapshot) (not .Prerelease) }}latest{{ end }}'
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Project-scoped OpenStack exporter for Prometheus
      org.opencontainers.image.url: https://github.com/krisiasty/osmex
      org.opencontainers.image.source: https://github.com/krisiasty/osmex
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: osmex
    ids:
      - darwin
    # Generate the cask locally until publishing to the tap is configured.
    # Removing skip_upload also requires a release token with write access to the tap.
    skip_upload: true
    repository:
      owner: krisiasty
      name: homebrew-tap
    homepage: "https://github.com/krisiasty/osmex"
    description: "Project-scoped OpenStack exporter for Prometheus"
    license: "Apache-2.0"
    binaries:
      - osmex
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"]
    caveats: |
      Run osmex -help for available options.

release:
  github:
    owner: krisiasty
    name: osmex
  draft: false
  prerelease: auto
  footer: |
    ## Container image

    ```text
    ghcr.io/krisiasty/osmex:v{{ .Version }}
    ```

    The image supports Linux amd64 and arm64. See the README for TLS, authentication and secret-file mounts.
