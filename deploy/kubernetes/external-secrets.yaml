# Requires an existing SecretStore named secret-store in this namespace.
# Replace remote keys/properties with those used by your secret provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: osmex-openstack
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: secret-store
    kind: SecretStore
  target:
    name: osmex-openstack
    creationPolicy: Owner
  data:
    - secretKey: application-credential-id
      remoteRef:
        key: osmex/openstack
        property: application_credential_id
    - secretKey: application-credential-secret
      remoteRef:
        key: osmex/openstack
        property: application_credential_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: osmex-scrape
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: secret-store
    kind: SecretStore
  target:
    name: osmex-scrape
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: osmex/scrape
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: osmex-tls
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    name: secret-store
    kind: SecretStore
  target:
    name: osmex-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      mergePolicy: Merge
  data:
    - secretKey: tls.crt
      remoteRef:
        key: osmex/tls
        property: certificate
    - secretKey: tls.key
      remoteRef:
        key: osmex/tls
        property: private_key
